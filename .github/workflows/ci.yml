name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install ruff flit_core
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q av_rsvp
      - run: find av_rsvp -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: pip wheel --no-deps . -w /tmp/wheels
  portal-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium --with-deps
      - run: node tests/portal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-screenshots
          path: /tmp/rsvp-portal-*.png
  frappe-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config redis-server libffi-dev libssl-dev
      - run: npm install -g yarn && pip install frappe-bench
      - name: Initialize Frappe
        run: bench init --frappe-branch version-16 --skip-assets --python "$(which python)" /tmp/rsvp-bench
      - name: Install and migrate app
        working-directory: /tmp/rsvp-bench
        run: |
          redis-server --port 13000 --daemonize yes
          redis-server --port 11000 --daemonize yes
          bench get-app "$GITHUB_WORKSPACE"
          bench new-site test_site --db-host 127.0.0.1 --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site test_site install-app av_rsvp
          bench --site test_site migrate
          bench --site test_site set-config allow_tests 1 --parse
      - name: Run integration tests
        working-directory: /tmp/rsvp-bench
        run: bench --site test_site run-tests --app av_rsvp
